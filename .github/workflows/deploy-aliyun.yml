name: Deploy to Aliyun (Staging & Per-PR Dev)

# 阿里云 push 式部署:
#   PR opened/sync   → 创建 / 复用 per-PR 资源
#                       站点:bucket gputest-cn-dev{N},直接用 OSS raw URL
#                            (https://gputest-cn-dev{N}.oss-cn-beijing.aliyuncs.com/)
#                       API: FC service gputest-fc-dev{N},用 FC 默认 *.fcapp.run URL
#                       前端通过 VITE_API_URL 跨域调 FC
#                       不绑自定义域名 / 不申请证书 / 不接 DCDN
#   PR closed        → 销毁 FC + bucket
#   push main        → 部署到 staging.gputest.cn(共享 staging 资源,Pulumi 管的)
#
# Prod 部署见 deploy-aliyun-prod.yml(workflow_dispatch + 审核)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: deploy-aliyun-${{ github.ref }}
  cancel-in-progress: true

env:
  ALIYUN_REGION: ${{ secrets.ALIYUN_REGION || 'cn-beijing' }}

jobs:
  # ─────────────────────────────────────────────
  # PR opened / sync / reopened → dev{N}.gputest.cn
  # ─────────────────────────────────────────────
  dev:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BUCKET: gputest-cn-dev${{ github.event.pull_request.number }}
      FC_SERVICE: gputest-fc-dev${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 计算 site URL
        id: site
        run: |
          echo "url=https://${BUCKET}.oss-${{ env.ALIYUN_REGION }}.aliyuncs.com" >> $GITHUB_OUTPUT

      - name: 安装 ossutil / serverless devs
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64 -o /usr/local/bin/ossutil
          chmod +x /usr/local/bin/ossutil
          ossutil config -e oss-${{ env.ALIYUN_REGION }}.aliyuncs.com \
            -i ${{ env.ALIYUN_ACCESS_KEY_ID }} \
            -k ${{ env.ALIYUN_ACCESS_KEY_SECRET }} \
            -L CH
          npm install -g @serverless-devs/s
          s config add --AccessKeyID ${{ env.ALIYUN_ACCESS_KEY_ID }} \
            --AccessKeySecret ${{ env.ALIYUN_ACCESS_KEY_SECRET }} \
            --AccountID ${{ secrets.ALIYUN_ACCOUNT_ID }} \
            -a aliyun-default -f

      - name: 创建 dev bucket(若不存在)+ 关闭 Block Public Access + 配置静态站
        env:
          OSS_BUCKET: ${{ env.BUCKET }}
        run: |
          if ossutil ls oss://$BUCKET >/dev/null 2>&1; then
            echo "bucket $BUCKET already exists, reuse"
          else
            ossutil mb oss://$BUCKET --acl public-read --storage-class Standard
          fi

          # 关闭 bucket 的 Block Public Access(默认开,不关掉就没法 set public-read ACL)
          # ossutil 1.7 没这个子命令,用 oss2 SDK 直接调 OSS API
          pip install -q oss2
          python3 - <<'PY'
          import os, oss2
          auth = oss2.Auth(os.environ['ALIYUN_ACCESS_KEY_ID'], os.environ['ALIYUN_ACCESS_KEY_SECRET'])
          bucket = oss2.Bucket(auth, f"oss-{os.environ['ALIYUN_REGION']}.aliyuncs.com", os.environ['OSS_BUCKET'])
          bucket.put_bucket_public_access_block(False)
          print(f"Block Public Access disabled on {os.environ['OSS_BUCKET']}")
          PY

          # 强制 set ACL public-read(覆盖历史 bucket 的 private 状态)
          ossutil set-acl oss://$BUCKET public-read -b -f

          # 静态站托管(SPA 兜底:404 → index.html)
          cat > /tmp/website.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <WebsiteConfiguration>
            <IndexDocument><Suffix>index.html</Suffix></IndexDocument>
            <ErrorDocument><Key>index.html</Key></ErrorDocument>
          </WebsiteConfiguration>
          XML
          ossutil website --method put oss://$BUCKET /tmp/website.xml

      - name: 编译 + 部署 FC,提取默认 URL
        id: fc
        run: |
          pnpm tsc -p functions/tsconfig.build.json
          sed "s/\${PR_NUMBER}/${PR_NUMBER}/g" aliyun/fc-dev.yaml > aliyun/fc-dev-rendered.yaml
          s deploy -y -t aliyun/fc-dev-rendered.yaml 2>&1 | tee /tmp/s-deploy.log

          # `s info` 文本输出里有 url.system_url 与 httpTrigger.urlInternet 两处 *.fcapp.run,
          # 提取第一个非 vpc 的 *.fcapp.run 即外网 URL
          S_INFO_TEXT=$(s info -y -t aliyun/fc-dev-rendered.yaml 2>&1 || true)
          FC_URL=$(echo "$S_INFO_TEXT" \
            | grep -oE 'https://[a-zA-Z0-9._-]+\.fcapp\.run[^[:space:]"]*' \
            | grep -v 'vpc' \
            | head -1 | sed 's:/$::')

          if [ -z "$FC_URL" ]; then
            echo "::error::无法提取 FC URL — 转储 s info 输出以便排查"
            echo "$S_INFO_TEXT"
            exit 1
          fi
          echo "FC default URL: $FC_URL"
          echo "fc_url=$FC_URL" >> $GITHUB_OUTPUT

      - name: 构建前端(注入 FC URL + raw OSS site URL)
        run: pnpm build
        env:
          VITE_ENV: dev
          VITE_PR_NUMBER: ${{ env.PR_NUMBER }}
          VITE_PUBLIC_URL: ${{ steps.site.outputs.url }}
          VITE_API_URL: ${{ steps.fc.outputs.fc_url }}
          VITE_COMMIT_SHA: ${{ github.sha }}

      - name: 同步 dist 到 OSS
        run: |
          # 1) assets/ — 让 ossutil 自动探测 Content-Type(JS/CSS/图片各自类型),
          #    再 set-meta --update 单独加 Cache-Control,不冲掉 Content-Type
          ossutil cp -r ./dist/assets/ oss://$BUCKET/assets/ --update
          ossutil set-meta oss://$BUCKET/assets/ 'Cache-Control:public, max-age=31536000, immutable' --update -r -f
          # 2) index.html — 显式 Content-Type:text/html(否则 --meta 替换会把它清空,浏览器当下载)
          ossutil cp ./dist/index.html oss://$BUCKET/index.html \
            --meta 'Content-Type:text/html#Cache-Control:no-cache, must-revalidate'
          # 3) 根目录其他单文件(robots / sitemap / favicon 等)— ossutil 1.7 的 exclude 不支持带斜杠,
          #    所以用 find 逐个上传顶层非 html 文件,让 ossutil 自动探测 Content-Type
          find ./dist -maxdepth 1 -type f ! -name '*.html' -print0 \
            | xargs -0 -I{} ossutil cp {} oss://$BUCKET/ --update

      - name: PR Preview comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-url
          message: |
            ## 🚀 Preview Deployment(阿里云,per-PR 隔离)

            | | |
            |---|---|
            | Site | ${{ steps.site.outputs.url }}/ |
            | API  | ${{ steps.fc.outputs.fc_url }} |
            | Bucket | `${{ env.BUCKET }}` |
            | FC service | `${{ env.FC_SERVICE }}` |
            | Commit | `${{ github.sha }}` |
            | Robots | `noindex, nofollow` |

            > dev 走 OSS 原生域名(自带证书),不绑自定义子域,不接 DCDN。
            > PR 关闭后会自动销毁 bucket 与 FC service。

  # ─────────────────────────────────────────────
  # push main → staging.gputest.cn
  # ─────────────────────────────────────────────
  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 构建前端
        run: pnpm build
        env:
          VITE_ENV: staging
          VITE_PUBLIC_URL: https://staging.gputest.cn
          VITE_API_URL: https://api-staging.gputest.cn
          VITE_COMMIT_SHA: ${{ github.sha }}

      - name: 安装 ossutil + aliyun cli
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64 -o /usr/local/bin/ossutil
          chmod +x /usr/local/bin/ossutil
          ossutil config -e oss-${{ env.ALIYUN_REGION }}.aliyuncs.com \
            -i ${{ env.ALIYUN_ACCESS_KEY_ID }} \
            -k ${{ env.ALIYUN_ACCESS_KEY_SECRET }} \
            -L CH
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o /tmp/aliyun.tgz
          tar -xzf /tmp/aliyun.tgz -C /usr/local/bin/
          aliyun configure set --profile default --mode AK \
            --region ${{ env.ALIYUN_REGION }} \
            --access-key-id ${{ env.ALIYUN_ACCESS_KEY_ID }} \
            --access-key-secret ${{ env.ALIYUN_ACCESS_KEY_SECRET }}

      - name: 同步 dist 到 OSS staging
        run: |
          BUCKET="${{ secrets.ALIYUN_OSS_BUCKET_STAGING }}"
          ossutil cp -r ./dist/assets/ oss://$BUCKET/assets/ --update
          ossutil set-meta oss://$BUCKET/assets/ 'Cache-Control:public, max-age=31536000, immutable' --update -r -f
          ossutil cp ./dist/index.html oss://$BUCKET/index.html \
            --meta 'Content-Type:text/html#Cache-Control:no-cache, must-revalidate'
          find ./dist -maxdepth 1 -type f ! -name '*.html' -print0 \
            | xargs -0 -I{} ossutil cp {} oss://$BUCKET/ --update

      - name: 部署 FC3.0 staging
        run: |
          npm install -g @serverless-devs/s
          s config add --AccessKeyID ${{ env.ALIYUN_ACCESS_KEY_ID }} \
            --AccessKeySecret ${{ env.ALIYUN_ACCESS_KEY_SECRET }} \
            --AccountID ${{ secrets.ALIYUN_ACCOUNT_ID }} \
            -a aliyun-default -f
          pnpm tsc -p functions/tsconfig.build.json
          s deploy -y -t aliyun/fc-staging.yaml

      - name: 刷新 DCDN
        run: |
          aliyun dcdn RefreshDcdnObjectCaches \
            --ObjectPath $'https://staging.gputest.cn/index.html\nhttps://staging.gputest.cn/sitemap.xml'

  # ─────────────────────────────────────────────
  # PR closed → 销毁该 PR 的全部 dev 资源
  # ─────────────────────────────────────────────
  teardown:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BUCKET: gputest-cn-dev${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 ossutil + s
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64 -o /usr/local/bin/ossutil
          chmod +x /usr/local/bin/ossutil
          ossutil config -e oss-${{ env.ALIYUN_REGION }}.aliyuncs.com \
            -i ${{ env.ALIYUN_ACCESS_KEY_ID }} \
            -k ${{ env.ALIYUN_ACCESS_KEY_SECRET }} \
            -L CH
          npm install -g @serverless-devs/s
          s config add --AccessKeyID ${{ env.ALIYUN_ACCESS_KEY_ID }} \
            --AccessKeySecret ${{ env.ALIYUN_ACCESS_KEY_SECRET }} \
            --AccountID ${{ secrets.ALIYUN_ACCOUNT_ID }} \
            -a aliyun-default -f

      - name: 删除 FC service
        run: |
          set +e
          sed "s/\${PR_NUMBER}/${PR_NUMBER}/g" aliyun/fc-dev.yaml > aliyun/fc-dev-rendered.yaml
          s remove -y -t aliyun/fc-dev-rendered.yaml
          true

      - name: 清空并删除 OSS bucket
        run: |
          set +e
          ossutil rm -r -f oss://$BUCKET
          ossutil rb -f oss://$BUCKET
          true

      - name: PR Preview comment(已清理)
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-url
          message: |
            ## 🧹 Preview 已清理

            PR 关闭,`${{ env.BUCKET }}` 与 `gputest-fc-dev${{ env.PR_NUMBER }}` 已销毁。
