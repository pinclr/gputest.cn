name: Deploy to Aliyun (Staging & Per-PR Dev)

# 阿里云 push 式部署:
#   PR opened/sync   → 创建 / 复用 dev{PR_NUMBER}.gputest.cn 全套独立资源
#                       (bucket gputest-cn-dev-pr-{N} + FC service gputest-fc-dev-pr-{N})
#                       FC 用默认 *.fcapp.run URL,前端通过 VITE_API_URL 跨域调
#   PR closed        → 销毁该 PR 的全部资源(DNS / FC / bucket)
#   push main        → 部署到 staging.gputest.cn(共享 staging 资源,Pulumi 管的)
#
# Prod 部署见 deploy-aliyun-prod.yml(workflow_dispatch + 审核)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: deploy-aliyun-${{ github.ref }}
  cancel-in-progress: true

env:
  ALIYUN_REGION: ${{ secrets.ALIYUN_REGION || 'cn-beijing' }}

jobs:
  # ─────────────────────────────────────────────
  # PR opened / sync / reopened → dev{N}.gputest.cn
  # ─────────────────────────────────────────────
  dev:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BUCKET: gputest-cn-dev-pr-${{ github.event.pull_request.number }}
      FC_SERVICE: gputest-fc-dev-pr-${{ github.event.pull_request.number }}
      SITE_DOMAIN: dev${{ github.event.pull_request.number }}.gputest.cn

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 安装 ossutil / aliyun cli / serverless devs
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64 -o /usr/local/bin/ossutil
          chmod +x /usr/local/bin/ossutil
          ossutil config -e oss-${{ env.ALIYUN_REGION }}.aliyuncs.com \
            -i ${{ env.ALIYUN_ACCESS_KEY_ID }} \
            -k ${{ env.ALIYUN_ACCESS_KEY_SECRET }} \
            -L CH
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o /tmp/aliyun.tgz
          tar -xzf /tmp/aliyun.tgz -C /usr/local/bin/
          aliyun configure set --profile default --mode AK \
            --region ${{ env.ALIYUN_REGION }} \
            --access-key-id ${{ env.ALIYUN_ACCESS_KEY_ID }} \
            --access-key-secret ${{ env.ALIYUN_ACCESS_KEY_SECRET }}
          npm install -g @serverless-devs/s
          s config add --AccessKeyID ${{ env.ALIYUN_ACCESS_KEY_ID }} \
            --AccessKeySecret ${{ env.ALIYUN_ACCESS_KEY_SECRET }} \
            --AccountID ${{ secrets.ALIYUN_ACCOUNT_ID }} \
            -a aliyun-default -f

      - name: 创建 dev bucket(若不存在)+ 配置静态站
        run: |
          if ossutil ls oss://$BUCKET >/dev/null 2>&1; then
            echo "bucket $BUCKET already exists, reuse"
          else
            ossutil mb oss://$BUCKET --acl public-read --storage-class Standard
          fi
          cat > /tmp/website.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <WebsiteConfiguration>
            <IndexDocument><Suffix>index.html</Suffix></IndexDocument>
            <ErrorDocument><Key>index.html</Key></ErrorDocument>
          </WebsiteConfiguration>
          XML
          ossutil website --method put oss://$BUCKET /tmp/website.xml

      - name: 添加 dev DNS CNAME(幂等)
        run: |
          RR="dev${PR_NUMBER}"
          TARGET="${BUCKET}.oss-website-${{ env.ALIYUN_REGION }}.aliyuncs.com"
          EXISTING=$(aliyun alidns DescribeDomainRecords \
            --DomainName gputest.cn --RRKeyWord "$RR" --SearchMode EXACT \
            --output cols=RecordId,RR,Value rows=DomainRecords.Record 2>/dev/null \
            | awk -v rr="$RR" '$2==rr {print $1; exit}')
          if [ -n "$EXISTING" ]; then
            aliyun alidns UpdateDomainRecord \
              --RecordId "$EXISTING" --RR "$RR" --Type CNAME --Value "$TARGET"
          else
            aliyun alidns AddDomainRecord \
              --DomainName gputest.cn --RR "$RR" --Type CNAME --Value "$TARGET"
          fi

      - name: 编译 + 部署 FC,提取默认 URL
        id: fc
        run: |
          pnpm tsc -p functions/tsconfig.json --outDir aliyun/dist
          sed "s/\${PR_NUMBER}/${PR_NUMBER}/g" aliyun/fc-dev.yaml > aliyun/fc-dev-rendered.yaml
          s deploy -y --target aliyun/fc-dev-rendered.yaml 2>&1 | tee /tmp/s-deploy.log

          # 提取 FC 默认 URL(优先 deploy 日志,回退 s info)
          FC_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.fcapp\.run[^[:space:]"]*' /tmp/s-deploy.log | head -1 | sed 's:/$::')
          if [ -z "$FC_URL" ]; then
            FC_URL=$(s info -y --target aliyun/fc-dev-rendered.yaml -o json 2>/dev/null \
              | jq -r 'recurse | objects | .urlInternet? // empty' | head -1)
          fi
          if [ -z "$FC_URL" ]; then
            echo "::error::无法从 s deploy 输出 / s info 中提取 FC URL"
            cat /tmp/s-deploy.log
            exit 1
          fi
          echo "FC default URL: $FC_URL"
          echo "fc_url=$FC_URL" >> $GITHUB_OUTPUT

      - name: 构建前端(注入 FC URL)
        run: pnpm build
        env:
          VITE_ENV: dev
          VITE_PR_NUMBER: ${{ env.PR_NUMBER }}
          VITE_PUBLIC_URL: https://${{ env.SITE_DOMAIN }}
          VITE_API_URL: ${{ steps.fc.outputs.fc_url }}
          VITE_COMMIT_SHA: ${{ github.sha }}

      - name: 同步 dist 到 OSS
        run: |
          # 1) assets/ 长缓存
          ossutil cp -r ./dist/assets/ oss://$BUCKET/assets/ \
            --update --meta 'Cache-Control:public, max-age=31536000, immutable'
          # 2) index.html 不缓存
          ossutil cp ./dist/index.html oss://$BUCKET/index.html \
            --meta 'Cache-Control:no-cache, must-revalidate'
          # 3) 根目录其他单文件(robots / sitemap / favicon 等)— ossutil 1.7 的 exclude 不支持带斜杠,
          #    所以用 find 逐个上传顶层非 html 文件
          find ./dist -maxdepth 1 -type f ! -name '*.html' -print0 \
            | xargs -0 -I{} ossutil cp {} oss://$BUCKET/ --update

      - name: PR Preview comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-url
          message: |
            ## 🚀 Preview Deployment(阿里云,per-PR 隔离)

            | | |
            |---|---|
            | Site | https://${{ env.SITE_DOMAIN }} |
            | API  | ${{ steps.fc.outputs.fc_url }} |
            | Bucket | `${{ env.BUCKET }}` |
            | FC service | `${{ env.FC_SERVICE }}` |
            | Commit | `${{ github.sha }}` |
            | Robots | `noindex, nofollow` |

            PR 关闭后会自动销毁这套资源(bucket / FC / DNS)。

  # ─────────────────────────────────────────────
  # push main → staging.gputest.cn
  # ─────────────────────────────────────────────
  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 构建前端
        run: pnpm build
        env:
          VITE_ENV: staging
          VITE_PUBLIC_URL: https://staging.gputest.cn
          VITE_API_URL: https://api-staging.gputest.cn
          VITE_COMMIT_SHA: ${{ github.sha }}

      - name: 安装 ossutil + aliyun cli
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64 -o /usr/local/bin/ossutil
          chmod +x /usr/local/bin/ossutil
          ossutil config -e oss-${{ env.ALIYUN_REGION }}.aliyuncs.com \
            -i ${{ env.ALIYUN_ACCESS_KEY_ID }} \
            -k ${{ env.ALIYUN_ACCESS_KEY_SECRET }} \
            -L CH
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o /tmp/aliyun.tgz
          tar -xzf /tmp/aliyun.tgz -C /usr/local/bin/
          aliyun configure set --profile default --mode AK \
            --region ${{ env.ALIYUN_REGION }} \
            --access-key-id ${{ env.ALIYUN_ACCESS_KEY_ID }} \
            --access-key-secret ${{ env.ALIYUN_ACCESS_KEY_SECRET }}

      - name: 同步 dist 到 OSS staging
        run: |
          BUCKET="${{ secrets.ALIYUN_OSS_BUCKET_STAGING }}"
          ossutil cp -r ./dist/assets/ oss://$BUCKET/assets/ \
            --update --meta 'Cache-Control:public, max-age=31536000, immutable'
          ossutil cp ./dist/index.html oss://$BUCKET/index.html \
            --meta 'Cache-Control:no-cache, must-revalidate'
          find ./dist -maxdepth 1 -type f ! -name '*.html' -print0 \
            | xargs -0 -I{} ossutil cp {} oss://$BUCKET/ --update

      - name: 部署 FC3.0 staging
        run: |
          npm install -g @serverless-devs/s
          s config add --AccessKeyID ${{ env.ALIYUN_ACCESS_KEY_ID }} \
            --AccessKeySecret ${{ env.ALIYUN_ACCESS_KEY_SECRET }} \
            --AccountID ${{ secrets.ALIYUN_ACCOUNT_ID }} \
            -a aliyun-default -f
          pnpm tsc -p functions/tsconfig.json --outDir aliyun/dist
          s deploy -y --target aliyun/fc-staging.yaml

      - name: 刷新 DCDN
        run: |
          aliyun dcdn RefreshDcdnObjectCaches \
            --ObjectPath $'https://staging.gputest.cn/index.html\nhttps://staging.gputest.cn/sitemap.xml'

  # ─────────────────────────────────────────────
  # PR closed → 销毁该 PR 的全部 dev 资源
  # ─────────────────────────────────────────────
  teardown:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BUCKET: gputest-cn-dev-pr-${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 ossutil + aliyun cli + s
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64 -o /usr/local/bin/ossutil
          chmod +x /usr/local/bin/ossutil
          ossutil config -e oss-${{ env.ALIYUN_REGION }}.aliyuncs.com \
            -i ${{ env.ALIYUN_ACCESS_KEY_ID }} \
            -k ${{ env.ALIYUN_ACCESS_KEY_SECRET }} \
            -L CH
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o /tmp/aliyun.tgz
          tar -xzf /tmp/aliyun.tgz -C /usr/local/bin/
          aliyun configure set --profile default --mode AK \
            --region ${{ env.ALIYUN_REGION }} \
            --access-key-id ${{ env.ALIYUN_ACCESS_KEY_ID }} \
            --access-key-secret ${{ env.ALIYUN_ACCESS_KEY_SECRET }}
          npm install -g @serverless-devs/s
          s config add --AccessKeyID ${{ env.ALIYUN_ACCESS_KEY_ID }} \
            --AccessKeySecret ${{ env.ALIYUN_ACCESS_KEY_SECRET }} \
            --AccountID ${{ secrets.ALIYUN_ACCOUNT_ID }} \
            -a aliyun-default -f

      - name: 删除 DNS 记录
        run: |
          set +e
          aliyun alidns DeleteSubDomainRecords \
            --DomainName gputest.cn --RR "dev${PR_NUMBER}" --Type CNAME
          true

      - name: 删除 FC service
        run: |
          set +e
          sed "s/\${PR_NUMBER}/${PR_NUMBER}/g" aliyun/fc-dev.yaml > aliyun/fc-dev-rendered.yaml
          s remove -y --target aliyun/fc-dev-rendered.yaml
          true

      - name: 清空并删除 OSS bucket
        run: |
          set +e
          ossutil rm -r -f oss://$BUCKET
          ossutil rb -f oss://$BUCKET
          true

      - name: PR Preview comment(已清理)
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-url
          message: |
            ## 🧹 Preview 已清理

            PR 关闭,`${{ env.BUCKET }}` / `gputest-fc-dev-pr-${{ env.PR_NUMBER }}` / `dev${{ env.PR_NUMBER }}.gputest.cn` 已销毁。
